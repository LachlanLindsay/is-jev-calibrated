[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcal"
version = "0.1.0"
description = "An independent calibration audit for typed-decision models such as TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jevcal = "jevcal.cli:main"

[tool.setuptools.packages.find]
include = ["jevcal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on deprecations *we* cause, but never on a dependency's. Erroring on
# every DeprecationWarning means any upstream release can break this suite
# without a line of our code changing -- which is exactly what an older
# matplotlib emitting a pyparsing deprecation at import time did.
filterwarnings = ["error::DeprecationWarning:jevcal"]
